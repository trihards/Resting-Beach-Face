<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050607">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sleep Sounds">
<title>Sleep Sounds</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #050607;
  --panel: #0b0e10;
  --panel-2: #0f1316;
  --line: #182024;
  --text: #7d878c;
  --text-dim: #4c5559;
  --text-faint: #333b3f;
  --ocean: #1f4a63;
  --ocean-dim: #12303f;
  --moss: #3e5b3c;
  --moss-dim: #213322;
  --accent-text: #8fa6a8;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  max-width: 620px; margin: 0 auto;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1 { font-size: 15px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); margin: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.dim-btn {
  min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text-dim);
}
#prep { font-size: 13px; color: var(--text-dim); height: 18px; margin: 4px 0 8px; opacity: 0; transition: opacity .4s; }
#prep.on { opacity: 1; }
#prep .bar { display: inline-block; width: 60px; height: 3px; background: var(--line); border-radius: 2px; margin-left: 8px; vertical-align: middle; overflow: hidden; position: relative; }
#prep .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--ocean); animation: slide 1.6s ease-in-out infinite; }
@keyframes slide { 0% { left: -40%; } 100% { left: 100%; } }

.section-label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); margin: 18px 2px 8px; }
.presets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.preset {
  position: relative; min-height: 56px; padding: 8px 12px; border-radius: 14px;
  background: var(--panel); border: 1px solid var(--line); color: var(--text);
  text-align: left; display: flex; align-items: center; overflow: hidden;
}
.preset .pname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preset.active { border-color: var(--ocean); background: var(--ocean-dim); color: var(--accent-text); }
.preset.custom { padding-right: 48px; }
.preset .del {
  position: absolute; right: 0; top: 0; bottom: 0; width: 48px; border: 0; background: transparent;
  color: var(--text-faint); font-size: 20px;
}
.preset.save { color: var(--text-dim); border-style: dashed; justify-content: center; }

.player { display: flex; flex-direction: column; align-items: center; margin: 22px 0 6px; }
#play {
  width: 148px; height: 148px; border-radius: 50%; border: 1px solid var(--line);
  background: radial-gradient(circle at 50% 40%, #10171b, #080b0d);
  display: grid; place-items: center; color: var(--accent-text);
}
#play.playing { border-color: var(--moss); box-shadow: 0 0 40px rgba(62, 91, 60, .12); }
#play svg { width: 56px; height: 56px; fill: currentColor; opacity: .75; }
#nowLabel { margin-top: 12px; color: var(--text-dim); font-size: 14px; min-height: 20px; text-align: center; }

.row { display: flex; align-items: center; gap: 12px; }
.row .lbl { width: 64px; color: var(--text-dim); font-size: 14px; flex: none; }
.master { margin: 14px 0 4px; }

input[type=range] {
  -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 44px; background: transparent; margin: 0;
}
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--line); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; margin-top: -12px;
  background: #2a3a40; border: 1px solid #36474d;
}
input[type=range]::-moz-range-thumb { width: 30px; height: 30px; border-radius: 50%; background: #2a3a40; border: 1px solid #36474d; }
input[type=range]:disabled { opacity: .35; }

.seg { display: flex; gap: 6px; flex: 1; }
.seg button {
  flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
  color: var(--text-dim); font-size: 14px; padding: 0 4px;
}
.seg button.on { background: var(--moss-dim); border-color: var(--moss); color: var(--accent-text); }
#timerLeft { font-size: 13px; color: var(--text-dim); text-align: right; min-height: 18px; margin-top: 4px; }

.cards { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px 10px; }
.card.on { border-color: #1d2c30; background: var(--panel-2); }
.card .head {
  width: 100%; min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: none; border: 0; padding: 0; text-align: left;
}
.card .title { font-size: 17px; color: var(--text); }
.card .sub { font-size: 13px; color: var(--text-faint); }
.card.on .title { color: var(--accent-text); }
.switch { flex: none; width: 56px; height: 32px; border-radius: 16px; background: #13191c; border: 1px solid var(--line); position: relative; transition: background .3s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #2a3236; transition: transform .25s, background .3s; }
.card.on .switch { background: var(--moss-dim); border-color: var(--moss); }
.card.on .switch::after { transform: translateX(24px); background: #5f7d5c; }
.card[data-id=ocean].on .switch, .card[data-id=purifier].on .switch, .card[data-id=shower].on .switch { background: var(--ocean-dim); border-color: var(--ocean); }
.card[data-id=ocean].on .switch::after, .card[data-id=purifier].on .switch::after, .card[data-id=shower].on .switch::after { background: #44708a; }
.extras { display: flex; gap: 6px; margin-top: 2px; }

#dim { position: fixed; inset: 0; background: #000; z-index: 99; display: none; }
#dim.on { display: block; }
#dim p { position: absolute; bottom: 30px; width: 100%; text-align: center; color: #111; font-size: 13px; margin: 0; }
.foot { margin-top: 22px; font-size: 12px; color: var(--text-faint); text-align: center; }
#resume { display: none; margin-top: 10px; min-height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid var(--ocean); background: var(--ocean-dim); color: var(--accent-text); }
</style>
</head>
<body>
<div class="top">
  <h1>Sleep Sounds</h1>
  <button class="dim-btn" id="dimBtn" aria-label="Black out the screen">Dim</button>
</div>
<div id="prep" aria-live="polite"><span id="prepText">Preparing sounds…</span><span class="bar"></span></div>

<div class="section-label">Presets</div>
<div class="presets" id="presets"></div>

<div class="player">
  <button id="play" aria-label="Play"></button>
  <div id="nowLabel"></div>
  <button id="resume">Tap to resume audio</button>
</div>

<div class="row master">
  <span class="lbl">Volume</span>
  <input type="range" id="master" min="0" max="100" step="1" aria-label="Master volume">
</div>

<div class="row">
  <span class="lbl">Timer</span>
  <div class="seg" id="timer"></div>
</div>
<div id="timerLeft"></div>

<div class="section-label">Sounds</div>
<div class="cards" id="cards"></div>

<div class="foot">Works offline · Audio keeps playing with the screen locked</div>

<div id="dim"><p>Tap to wake</p></div>

<!-- ===================== Audio synthesis worker ===================== -->
<script type="text/plain" id="worker-src">
'use strict';
const SR = 22050;          // sample rate (Nyquist 11 kHz is plenty for sleep sounds)
const LOOP = 180;          // every mix is a 180 s loop; layer lengths divide it
const VERSION = 4;         // bump to invalidate cached layers
const LEN = { fan: 60, purifier: 60, rain: 60, shower: 60, creek: 60, forest: 180, birds: 180, oceanD: 180, oceanS: 180 };
const NAMES = ['fan', 'purifier', 'rain', 'shower', 'forest', 'creek', 'birds', 'oceanD', 'oceanS'];
// Final loudness of each layer at gain 1.0 (RMS, or peak for the sparse bird layer).
const TARGET = { fan: 0.16, purifier: 0.12, rain: 0.12, shower: 0.11, forest: 0.13, creek: 0.10, birds: 0.30, oceanD: 0.14, oceanS: 0.13 };
const TAU = Math.PI * 2;

// ---------- DSP building blocks ----------
function rng(seed) {
  let s = (seed * 2654435761) >>> 0 || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return (s >>> 0) / 4294967296; };
}
class BQ {
  constructor(type, f, q = 0.707, db = 0) { this.x1 = this.x2 = this.y1 = this.y2 = 0; this.set(type, f, q, db); }
  set(type, f, q = 0.707, db = 0) {
    const w = TAU * Math.min(f, SR * 0.45) / SR, cs = Math.cos(w), sn = Math.sin(w), a = sn / (2 * q), A = Math.pow(10, db / 40);
    let b0, b1, b2, a0, a1, a2;
    if (type === 'lp') { b0 = (1 - cs) / 2; b1 = 1 - cs; b2 = b0; a0 = 1 + a; a1 = -2 * cs; a2 = 1 - a; }
    else if (type === 'hp') { b0 = (1 + cs) / 2; b1 = -(1 + cs); b2 = b0; a0 = 1 + a; a1 = -2 * cs; a2 = 1 - a; }
    else if (type === 'bp') { b0 = a; b1 = 0; b2 = -a; a0 = 1 + a; a1 = -2 * cs; a2 = 1 - a; }
    else { b0 = 1 + a * A; b1 = -2 * cs; b2 = 1 - a * A; a0 = 1 + a / A; a1 = -2 * cs; a2 = 1 - a / A; } // peak
    this.b0 = b0 / a0; this.b1 = b1 / a0; this.b2 = b2 / a0; this.a1 = a1 / a0; this.a2 = a2 / a0;
  }
  p(x) {
    const y = this.b0 * x + this.b1 * this.x1 + this.b2 * this.x2 - this.a1 * this.y1 - this.a2 * this.y2;
    this.x2 = this.x1; this.x1 = x; this.y2 = this.y1; this.y1 = y; return y;
  }
}
// Zero-delay state-variable filter: smooth when its cutoff is swept (used for waves).
class SVF {
  constructor(f, q = 0.7) { this.s1 = this.s2 = 0; this.k = 1 / q; this.set(f); }
  set(f) { const g = Math.tan(Math.PI * Math.min(f, SR * 0.45) / SR); this.a1 = 1 / (1 + g * (g + this.k)); this.a2 = g * this.a1; this.a3 = g * this.a2; }
  p(x) {
    const v3 = x - this.s2, v1 = this.a1 * this.s1 + this.a2 * v3, v2 = this.s2 + this.a2 * this.s1 + this.a3 * v3;
    this.s1 = 2 * v1 - this.s1; this.s2 = 2 * v2 - this.s2; return v2;
  }
}
const white = r => () => r() * 2 - 1;
function pink(r) {
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
  return () => {
    const w = r() * 2 - 1;
    b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
    b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
    const o = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362; b6 = w * 0.115926; return o;
  };
}
function brown(r) { let l = 0; return () => { l = (l + 0.02 * (r() * 2 - 1)) / 1.02; return l; }; }
// Smooth random wander in [-1, 1]; picks a new target `rate` times per second.
function wander(r, rate) {
  let a = r() * 2 - 1, b = r() * 2 - 1, ph = r(); const inc = rate / SR;
  return () => { ph += inc; if (ph >= 1) { ph -= 1; a = b; b = r() * 2 - 1; } return a + (b - a) * (1 - Math.cos(Math.PI * ph)) / 2; };
}
// Wrap a generator factory so its output has unit RMS (measured on a private calibration run).
function unit(make, r) {
  const t = make(rng(4242)); for (let i = 0; i < SR; i++) t();
  let s = 0; const n = SR * 3; for (let i = 0; i < n; i++) { const v = t(); s += v * v; }
  const k = 1 / Math.sqrt(s / n || 1); const g = make(r); return () => g() * k;
}
const chain = (src, ...f) => () => { let x = src(); for (let i = 0; i < f.length; i++) x = f[i].p(x); return x; };
const stereo = n => [new Float32Array(n), new Float32Array(n)];
const panL = p => Math.cos((p + 1) * Math.PI / 4) * Math.SQRT2;
const panR = p => Math.sin((p + 1) * Math.PI / 4) * Math.SQRT2;

// Fold the X-sample tail of a (len+X) render back over its head with an equal-power
// crossfade, so sample len-1 flows straight into sample 0: a click-free loop.
function loopify(b, len, X) {
  const o = stereo(len);
  for (let c = 0; c < 2; c++) {
    const s = b[c], d = o[c]; d.set(s.subarray(0, len));
    for (let i = 0; i < X; i++) { const t = i / X; d[i] = s[i] * Math.sin(t * Math.PI / 2) + s[len + i] * Math.cos(t * Math.PI / 2); }
  }
  return o;
}
function rms(b) { let s = 0; for (const c of b) for (let i = 0; i < c.length; i++) s += c[i] * c[i]; return Math.sqrt(s / (b[0].length * 2)); }
function scale(b, k) { for (const c of b) for (let i = 0; i < c.length; i++) c[i] *= k; }

// Short filtered-noise burst (rain drop, pebble tick). Written with wrap-around so loops stay seamless.
function burst(o, r, at, f, q, tau, amp, pan) {
  const bq = new BQ('bp', f, q), N = o[0].length, n = Math.min(Math.ceil(tau * SR * 7), SR), att = Math.max(2, Math.round(0.0005 * SR));
  const gl = amp * panL(pan), gr = amp * panR(pan), kd = Math.exp(-1 / (tau * SR));
  let e = 1, k = ((at % N) + N) % N;
  for (let j = 0; j < n; j++) {
    const y = bq.p((r() * 2 - 1) * (j < att ? j / att : 1) * e); e *= kd;
    o[0][k] += y * gl; o[1][k] += y * gr; if (++k >= N) k = 0;
  }
}
// Damped sine with a small upward pitch glide: the "plip" of a drop or a creek bubble.
function plop(o, at, f0, rise, tau, amp, pan) {
  const N = o[0].length, n = Math.min(Math.ceil(tau * SR * 7), SR), gl = amp * panL(pan), gr = amp * panR(pan);
  let ph = 0, k = ((at % N) + N) % N;
  for (let j = 0; j < n; j++) {
    const t = j / SR, f = Math.min(f0 * (1 + (rise - 1) * (1 - Math.exp(-t / tau))), SR * 0.45);
    ph += TAU * f / SR;
    const y = Math.sin(ph) * (1 - Math.exp(-t / 0.0012)) * Math.exp(-t / tau);
    o[0][k] += y * gl; o[1][k] += y * gr; if (++k >= N) k = 0;
  }
}

// ---------- Sounds ----------
function synthFan() {
  const len = 60 * SR, X = 4 * SR, N = len + X, r = rng(101), b = stereo(N);
  const mk = rr => { const g = brown(rr), f1 = new BQ('lp', 700, 0.55), f2 = new BQ('lp', 1500, 0.5), f3 = new BQ('hp', 28); return chain(g, f1, f2, f3); };
  const mid = unit(mk, r), sideL = unit(mk, r), sideR = unit(mk, r);
  const mkAir = rr => chain(pink(rr), new BQ('lp', 2400, 0.5), new BQ('hp', 120));
  const airL = unit(mkAir, r), airR = unit(mkAir, r);
  const mkMid = rr => chain(pink(rr), new BQ('bp', 320, 0.6), new BQ('lp', 1200, 0.5));
  const midL = unit(mkMid, r), midR = unit(mkMid, r);
  const w1 = wander(r, 0.12), w2 = wander(r, 0.035);
  for (let i = 0; i < N; i++) {
    const m = mid(), a = 1 + 0.03 * w1() + 0.025 * w2();
    b[0][i] = (m * 0.75 + sideL() * 0.5 + airL() * 0.42 + midL() * 0.38) * a;
    b[1][i] = (m * 0.75 + sideR() * 0.5 + airR() * 0.42 + midR() * 0.38) * a;
  }
  const o = loopify(b, len, X); scale(o, 1 / rms(o));
  // Blade flutter and motor hum use whole-number cycles per 60 s, so they loop perfectly.
  for (let i = 0; i < len; i++) {
    const t = i / SR, am = 1 + 0.012 * Math.sin(TAU * 11.5 * t) + 0.005 * Math.sin(TAU * 23 * t + 1.3);
    const hum = (0.03 * Math.sin(TAU * 58 * t) + 0.012 * Math.sin(TAU * 116 * t + 0.7) + 0.005 * Math.sin(TAU * 174 * t + 2)) * (1 + 0.3 * Math.sin(TAU * t / 30));
    o[0][i] = o[0][i] * am + hum; o[1][i] = o[1][i] * am + hum;
  }
  return o;
}

function synthPurifier() {
  const len = 60 * SR, X = 4 * SR, N = len + X, r = rng(202), b = stereo(N);
  const mk = rr => chain(pink(rr), new BQ('hp', 140, 0.7), new BQ('lp', 5200, 0.6), new BQ('peak', 950, 0.8, 2.5));
  const c = unit(mk, r), l = unit(mk, r), rr2 = unit(mk, r);
  const mkBody = rr => chain(brown(rr), new BQ('lp', 320), new BQ('hp', 40));
  const body = unit(mkBody, r), w = wander(r, 0.06);
  for (let i = 0; i < N; i++) {
    const a = 1 + 0.012 * w(), cc = c() * 0.6, bd = body() * 0.3;
    b[0][i] = (cc + l() * 0.75 + bd) * a; b[1][i] = (cc + rr2() * 0.75 + bd) * a;
  }
  return loopify(b, len, X);
}

function synthRain() {
  const len = 60 * SR, X = 4 * SR, N = len + X, r = rng(303), b = stereo(N);
  const mk = rr => chain(pink(rr), new BQ('hp', 280, 0.7), new BQ('lp', 6500, 0.6), new BQ('peak', 2500, 0.9, 2));
  const c = unit(mk, r), l = unit(mk, r), rr2 = unit(mk, r);
  const body = unit(rr => chain(brown(rr), new BQ('lp', 450), new BQ('hp', 35)), r);
  const w = wander(r, 0.05), w2 = wander(r, 0.2);
  for (let i = 0; i < N; i++) {
    const a = 1 + 0.05 * w() + 0.02 * w2(), cc = c() * 0.5, bd = body() * 0.45;
    b[0][i] = (cc + l() * 0.85 + bd) * a; b[1][i] = (cc + rr2() * 0.85 + bd) * a;
  }
  const o = loopify(b, len, X); scale(o, 1 / rms(o));
  // Soft droplets: many tiny filtered ticks, mostly quiet, scattered across the stereo field.
  for (let k = 0; k < 60 * 120; k++) {
    const amp = 2.2 * (0.12 + Math.pow(r(), 3) * 0.9);
    burst(o, r, Math.floor(r() * len), 1500 + r() * 5000, 1.2 + r() * 3, 0.0015 + r() * 0.006, amp, r() * 1.8 - 0.9);
  }
  // A few gentle "plinks" of drops landing in puddles.
  for (let k = 0; k < 60 * 3; k++) plop(o, Math.floor(r() * len), 1100 + r() * 2000, 1.08, 0.012 + r() * 0.02, 0.05 + r() * 0.1, r() * 1.6 - 0.8);
  return o;
}

function synthShower() {
  const len = 60 * SR, X = 3 * SR, N = len + X, r = rng(404), b = stereo(N);
  const mk = rr => { const w = white(rr), p = pink(rr); return chain(() => w() * 0.35 + p() * 0.1, new BQ('hp', 380, 0.7), new BQ('peak', 3600, 0.7, 4), new BQ('lp', 9500, 0.6)); };
  const l = unit(mk, r), rr2 = unit(mk, r), c = unit(mk, r);
  const tub = unit(rr => chain(pink(rr), new BQ('bp', 650, 0.6)), r);
  // Fast random turbulence: noise low-passed to ~30 Hz drives the amplitude.
  const mkTurb = rr => chain(white(rr), new BQ('lp', 30, 0.6), new BQ('lp', 30, 0.6));
  const tL = unit(mkTurb, r), tR = unit(mkTurb, r), w = wander(r, 0.4);
  for (let i = 0; i < N; i++) {
    const s = 1 + 0.04 * w(), cc = c() * 0.5, tb = tub() * 0.35;
    b[0][i] = ((l() * 0.8 + cc) * (1 + 0.2 * tL()) + tb) * s;
    b[1][i] = ((rr2() * 0.8 + cc) * (1 + 0.2 * tR()) + tb) * s;
  }
  const o = loopify(b, len, X); scale(o, 1 / rms(o));
  for (let k = 0; k < 60 * 350; k++) burst(o, r, Math.floor(r() * len), 2800 + r() * 6000, 2 + r() * 3, 0.0005 + r() * 0.0015, 1.6 * (0.2 + r() * r()), r() * 1.6 - 0.8);
  return o;
}

function synthForest() {
  const len = 180 * SR, X = 6 * SR, N = len + X, r = rng(505), b = stereo(N);
  // Canopy-softened rain: pink noise, steep low-pass, so it's warmer and more muffled than open rain.
  const mk = rr => chain(pink(rr), new BQ('lp', 1300, 0.5), new BQ('lp', 2100, 0.5), new BQ('hp', 60));
  const c = unit(mk, r), l = unit(mk, r), rr2 = unit(mk, r);
  const body = unit(rr => chain(brown(rr), new BQ('lp', 300), new BQ('hp', 30)), r);

const ZERO = NAMES.map(() => 0);

// ---------- Worker & rendered files ----------
const worker = new Worker(URL.createObjectURL(new Blob([$('worker-src').textContent], { type: 'text/javascript' })));

const call = msg => new Promise((res, rej) => { const id = ++reqId; waiting.set(id, { res, rej }); worker.postMessage({ ...msg, id }); });
const PREP_NAMES = { fan: 'fan', purifier: 'air purifier', rain: 'rain', shower: 'shower', forest: 'rainforest', creek: 'creek', birds: 'birds', oceanD: 'ocean', oceanS: 'shoreline' };
function showPrep() {
  const on = prepping.size > 0; $('prep').classList.toggle('on', on);
  if (on) $('prepText').textContent = 'Preparing sounds… ' + [...prepping].map(n => PREP_NAMES[n]).join(', ');
}

// A "file" is a rendered WAV plus the description of what it contains.
async function render(spec) {
  const m = await call({ type: 'mix', ...spec });
  return { ...spec, url: URL.createObjectURL(new Blob([m.wav], { type: 'audio/wav' })) };
}
const files = new Map(); // small cache of steady loops / intros keyed by content
async function cached(k, spec) {
  if (files.has(k)) { const f = files.get(k); files.delete(k); files.set(k, f); return f; }
  const p = render(spec); files.set(k, p);
  while (files.size > 4) { const [ok, of] = files.entries().next().value; files.delete(ok); of.then(f => release(f)); }

}

const once = (el, ev) => new Promise(res => el.addEventListener(ev, res, { once: true }));
async function loaded(el) { if (el.readyState < 1) await Promise.race([once(el, 'loadedmetadata'), sleep(4000)]); }

// ---------- Engine A: browsers that allow volume control (Android, desktop) ----------
// Each mix is one seamless 180 s loop in an <audio loop>. Fades are volume ramps; a mix
// change starts the new loop on a second element at an unrelated position and equal-power
// crossfades, so shared layers keep a constant level.
function makeVolumeEngine() {
  const E = { playing: false, voices: [], cur: null, timerId: 0 };
  const apply = v => { v.el.volume = Math.max(0, Math.min(1, v.level * masterGain())); };
  const shapes = { in: s => s * s, sin: s => Math.sin(s * Math.PI / 2), cos: s => 1 - Math.cos(s * Math.PI / 2) };
  function tick() {
    const now = performance.now(); let busy = false;
    for (const v of E.voices.slice()) {
      const r = v.ramp; if (!r) continue; busy = true;
      const s = Math.min(1, (now - r.t0) / r.dur); v.level = r.a + (r.b - r.a) * shapes[r.shape](s); apply(v);
      if (s >= 1) { v.ramp = null; r.done && r.done(); }

  }
  function rampTo(v, b, sec, shape, done) { v.ramp = { a: v.level, b, t0: performance.now(), dur: Math.max(1, sec * 1000), shape, done }; if (!E.timerId) E.timerId = setInterval(tick, 50); }

  async function spawn(file, at) {
    const el = new Audio(); el.loop = true; el.preload = 'auto'; el.src = file.url;
    const v = { el, file, level: 0, ramp: null }; apply(v); E.voices.push(v);
    el.addEventListener('pause', () => { if (!el._kill && E.playing && E.cur === v) external(); });
    await loaded(el); try { el.currentTime = at; } catch (e) {}
    await el.play(); return v;
  }
  E.uses = f => E.voices.some(v => v.file === f);
  E.pos = () => { const v = E.cur; return v ? v.el.currentTime % LOOP : 0; };
  E.start = async () => {
    E.playing = true; const f = await loopFile(gains(false)); if (!E.playing) return;
    try { const v = await spawn(f, 0); E.cur = v; rampTo(v, 1, 10, 'in'); }
    catch (e) { E.playing = false; needsTap(); }
  };
  E.update = async ramp => {
    if (!E.playing) return; const f = await loopFile(gains(false));
    if (!E.playing || (E.cur && E.cur.file === f)) return;
    const at = (E.pos() + LOOP * (0.35 + Math.random() * 0.3)) % LOOP;
    try {
      const v = await spawn(f, at);
      for (const o of E.voices) if (o !== v) rampTo(o, 0, ramp, 'cos', () => kill(o));
      E.cur = v; rampTo(v, 1, ramp, 'sin');

  function external() { E.playing = false; for (const v of E.voices.slice()) kill(v); E.cur = null; onExternalStop(); }

}

// ---------- Engine B: iOS (element volume is read-only) ----------
// All gains, master volume and fades are baked into the audio. A transition renders a short
// file that starts exactly where the current loop is, ramps to the new mix, and is then
// handed off (position-matched) to the new steady loop.
function makeBakedEngine() {
  const E = { playing: false, els: [new Audio(), new Audio()], cur: 0, gen: 0, handoff: null };

    el.addEventListener('timeupdate', () => { if (el === E.els[E.cur]) { checkHandoff(false); timerTick(); } });
  }
  const A = () => E.els[E.cur];

    let ft = fileTime;

    if (ft > f.len - 0.1) ft = f.loop ? ft % f.len : f.len - 0.1;
    try { b.currentTime = ft; } catch (e) {}
    try { await b.play(); } catch (err) {

      b._f = null; b.removeAttribute('src');

      try { a.currentTime = ft; } catch (e) {}

    }

    E.playing = true; const gen = ++E.gen, g = gains(true);
    try {

      await loaded(a); try { a.currentTime = 0; } catch (e) {}
      await a.play(); planHandoff(gen, T, g);
    } catch (e) { if (gen === E.gen) { E.playing = false; needsTap(); } }
  };
  E.update = async ramp => {
    if (!E.playing) return; const gen = ++E.gen, g = gains(true), a = A();
    if (!a._f) return;
    const from = gainAt(a._f, a.currentTime); if (sigOf(from) === sigOf(g) && a._f.loop) return;
    const pre = 0.8, T = await render({ from, to: g, p0: pos(a), pre, ramp, len: pre + ramp + 14, loop: false });
    if (gen !== E.gen) { URL.revokeObjectURL(T.url); return; }

    try { await swapTo(T); planHandoff(gen, T, g); } catch (e) {}
  };

const isIOS = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const volumeWorks = (() => { try { const a = new Audio(); a.volume = 0.5; return Math.abs(a.volume - 0.5) < 0.01; } catch (e) { return false; } })();
const forced = new URLSearchParams(location.search).get('engine'); // ?engine=baked to test the iOS path
const engine = (forced ? forced === 'baked' : (isIOS || !volumeWorks)) ? makeBakedEngine() : makeVolumeEngine();

// ---------- Transport ----------
let wantPlaying = false;
function onExternalStop() { wantPlaying = false; timer.deadline = 0; refreshTransport(); }
function needsTap() { wantPlaying = false; $('resume').style.display = 'inline-block'; refreshTransport(); }
function play() {
  engine.unlock(); $('resume').style.display = 'none';
  wantPlaying = true; if (timer.hours && !timer.deadline) timer.deadline = Date.now() + timer.hours * 3600e3;
  engine.start(); refreshTransport();
}
function pause(fade) { wantPlaying = false; timer.deadline = 0; timer.fading = false; engine.stop(fade); refreshTransport(); prerender(); }

let applyT = 0;
function changed(ramp, delay = 250) {
  save(); refreshUI();
  clearTimeout(applyT);
  applyT = setTimeout(() => { if (engine.playing) engine.update(ramp); else prerender(); }, delay);
}
let preT = 0;
function prerender() {
  clearTimeout(preT);
  preT = setTimeout(() => {
    const g = gains(engine.masterBaked);
    const p = engine.masterBaked ? introFile(g).then(() => loopFile(g)) : loopFile(g);
    p.catch(() => {}).then(warmAll);
  }, 300);
}
let warmed = false;
async function warmAll() { // render remaining sounds into the cache in the background
  if (warmed) return; warmed = true;
  for (const n of NAMES) { await sleep(400); try { await call({ type: 'warm', name: n }); } catch (e) {} }
}

// ---------- Sleep timer ----------
const timer = { hours: 0, deadline: 0, fading: false };
function timerTick() {
  if (!timer.deadline || !wantPlaying) return;
  const left = timer.deadline - Date.now();
  if (left <= 60e3 && !timer.fading) {
    timer.fading = true; wantPlaying = false;
    engine.stop(Math.max(2, left / 1000));
    setTimeout(() => { timer.hours = 0; timer.deadline = 0; timer.fading = false; refreshUI(); refreshTransport(); prerender(); }, Math.max(2000, left));
    refreshTransport();
  }
}
setInterval(() => { timerTick(); showTimerLeft(); }, 1000);
function showTimerLeft() {
  const el = $('timerLeft');
  if (!timer.hours) { el.textContent = ''; return; }
  if (!timer.deadline) { el.textContent = `Fades out ${timer.hours}h after you press play`; return; }
  const s = Math.max(0, Math.round((timer.deadline - Date.now()) / 1000));
  el.textContent = timer.fading ? 'Fading out…' : `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')} left`;
}

// ---------- Media Session (lock screen) ----------
function presetLabel() { return state.preset || 'Custom mix'; }
function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: presetLabel(), artist: 'Sleep Sounds', album: describeMix(),
      artwork: [{ src: 'icon-192.png', sizes: '192x192', type: 'image/png' }, { src: 'icon-512.png', sizes: '512x512', type: 'image/png' }],
    });
    navigator.mediaSession.playbackState = wantPlaying ? 'playing' : 'paused';
  } catch (e) {}
}
if ('mediaSession' in navigator) {
  const h = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
  h('play', () => { if (!wantPlaying) play(); });
  h('pause', () => { if (wantPlaying) pause(1.5); });
  h('stop', () => { if (wantPlaying) pause(1.5); });
}
function describeMix() {
  const S = state.sounds; return SOUNDS.filter(s => S[s.id].on).map(s => s.id === 'ocean' ? (S.ocean.style === 'shore' ? 'Shoreline' : 'Distant surf') : s.name).join(' + ') || 'Silence';
}

// ---------- UI ----------
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1.2"/><rect x="13.5" y="5" width="4" height="14" rx="1.2"/></svg>';
function refreshTransport() {
  const b = $('play'); b.innerHTML = wantPlaying ? ICON_PAUSE : ICON_PLAY; b.classList.toggle('playing', wantPlaying);
  b.setAttribute('aria-label', wantPlaying ? 'Pause' : 'Play');
  $('nowLabel').textContent = presetLabel() + ' · ' + describeMix();
  showTimerLeft(); updateMediaSession();
}
function selectPreset(name, mix) {
  state.sounds = mixFrom(mix); state.preset = name; changed(5, 50);
}
function renderPresets() {
  const box = $('presets'); box.innerHTML = '';
  const add = (name, mix, custom) => {
    const b = document.createElement('button'); b.className = 'preset' + (custom ? ' custom' : '') + (state.preset === name ? ' active' : '');
    b.innerHTML = '<span class="pname"></span>'; b.firstChild.textContent = name;
    b.onclick = () => selectPreset(name, mix);
    if (custom) {
      const d = document.createElement('span'); d.className = 'del'; d.setAttribute('role', 'button'); d.setAttribute('aria-label', 'Delete ' + name);
      d.textContent = '×'; d.style.display = 'grid'; d.style.placeItems = 'center';
      d.onclick = e => { e.stopPropagation(); if (confirm(`Delete preset "${name}"?`)) { customs = customs.filter(c => c.name !== name); lsSet('ssm.custom', customs); if (state.preset === name) state.preset = null; save(); refreshUI(); } };
      b.appendChild(d);
    }
    box.appendChild(b);
  };
  PRESETS.forEach(p => add(p.name, p.mix, false));
  customs.forEach(p => add(p.name, p.mix, true));
  const s = document.createElement('button'); s.className = 'preset save'; s.textContent = '+ Save current mix';
  s.onclick = () => {
    const name = (prompt('Name this mix:', state.preset && !PRESETS.some(p => p.name === state.preset) ? state.preset : '') || '').trim().slice(0, 40);
    if (!name) return;
    if (PRESETS.some(p => p.name === name)) { alert('That name is used by a built-in preset.'); return; }
    customs = customs.filter(c => c.name !== name); customs.push({ name, mix: clone(state.sounds) });
    lsSet('ssm.custom', customs); state.preset = name; save(); refreshUI();
  };
  box.appendChild(s);
}
function seg(options, current, onPick) {
  const d = document.createElement('div'); d.className = 'seg';
  for (const [val, label] of options) {
    const b = document.createElement('button'); b.textContent = label; if (val === current) b.className = 'on';
    b.onclick = e => { e.stopPropagation(); onPick(val); }; d.appendChild(b);
  }
  return d;
}
function edited() { state.preset = null; }
function renderCards() {
  const box = $('cards'); box.innerHTML = '';
  for (const s of SOUNDS) {
    const st = state.sounds[s.id], card = document.createElement('div');
    card.className = 'card' + (st.on ? ' on' : ''); card.dataset.id = s.id;
    const head = document.createElement('button'); head.className = 'head';
    head.innerHTML = '<span><div class="title"></div><div class="sub"></div></span><span class="switch"></span>';
    head.querySelector('.title').textContent = s.name; head.querySelector('.sub').textContent = s.sub;
    head.setAttribute('aria-pressed', st.on);
    head.onclick = () => { st.on = !st.on; edited(); changed(3); };
    const range = document.createElement('input'); range.type = 'range'; range.min = 0; range.max = 100; range.value = st.vol;
    range.setAttribute('aria-label', s.name + ' volume'); range.disabled = !st.on;
    range.oninput = () => { st.vol = +range.value; edited(); save(); };
    range.onchange = () => { st.vol = +range.value; edited(); changed(2, 300); };
    const row = document.createElement('div'); row.className = 'row'; row.appendChild(range);
    card.append(head, row);
    if (s.id === 'forest') {
      const ex = document.createElement('div'); ex.className = 'extras';
      const chip = (k, label) => seg([[true, label]], st[k], () => { st[k] = !st[k]; edited(); changed(3); });
      ex.append(chip('creek', 'Distant creek'), chip('birds', 'Dawn birds'));
      card.appendChild(ex);
    }
    if (s.id === 'ocean') {
      const ex = document.createElement('div'); ex.className = 'extras';
      ex.append(seg([['distant', 'Distant surf'], ['shore', 'Shoreline']], st.style, v => { st.style = v; edited(); changed(4); }));
      card.appendChild(ex);
    }
    box.appendChild(card);
  }
}
function renderTimer() {
  const t = $('timer'); t.replaceWith(Object.assign(seg(TIMERS.map(h => [h, h ? h + 'h' : 'Off']), timer.hours, h => {
    timer.hours = h; timer.fading = false; timer.deadline = h && wantPlaying ? Date.now() + h * 3600e3 : 0; refreshUI();
  }), { id: 'timer' }));
}
function refreshUI() { renderPresets(); renderCards(); renderTimer(); refreshTransport(); }

$('play').onclick = () => wantPlaying ? pause(4) : play();
$('resume').onclick = () => play();
const master = $('master'); master.value = state.master;
master.oninput = () => { state.master = +master.value; save(); engine.master(); };
master.onchange = () => { state.master = +master.value; save(); if (engine.masterBaked) changed(1.2, 200); };
$('dimBtn').onclick = () => $('dim').classList.add('on');
$('dim').onclick = () => $('dim').classList.remove('on');
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  timerTick(); refreshTransport();
  if (wantPlaying && !timer.fading) setTimeout(() => { if (wantPlaying && !engine.alive()) { engine.stop(0); needsTap(); } }, 1500);
});

refreshUI();
prerender();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
